name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web
        run: cd web && npm ci && npm run build

      - name: Copy frontend to embed directory
        run: cp -r web/dist/. internal/core/api/frontend/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Go build
        run: go build ./...

      - name: Go vet
        run: go vet ./...

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [core, metadata, indexer, downloader]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/${{ matrix.service }}/Dockerfile
          push: false