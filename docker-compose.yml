services:
  postgres:
    image: postgres:16
    container_name: kbarr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  core:
    image: ghcr.io/kingbenny101/kbarr-core:latest
    container_name: kbarr-core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PORT: ${PORT:-8282}
      KBARR_DATA_DIR: /app/data
      METADATA_ADDR: http://metadata:8081
      INDEXER_HEALTH_ADDR: http://indexer:8082
      DOWNLOADER_HEALTH_ADDR: http://downloader:8083
    ports:
      - "${PORT:-8282}:${PORT:-8282}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${DATA_DIR_HOST:-./data}:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-8282}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  metadata:
    image: ghcr.io/kingbenny101/kbarr-metadata:latest
    container_name: kbarr-metadata
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      ANIDB_SERVICE_PORT: "8081"
      KBARR_DATA_DIR: /app/data
    volumes:
      - ${DATA_DIR_HOST:-./data}:/app/data
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  indexer:
    image: ghcr.io/kingbenny101/kbarr-indexer:latest
    container_name: kbarr-indexer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      KBARR_DATA_DIR: /app/data
    volumes:
      - ${DATA_DIR_HOST:-./data}:/app/data
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  downloader:
    image: ghcr.io/kingbenny101/kbarr-downloader:latest
    container_name: kbarr-downloader
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pg_data:

networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: "1380"
