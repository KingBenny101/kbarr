services:
  postgres:
    image: postgres:16
    ports:
    - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  metadata:
    image: ghcr.io/kingbenny101/kbarr-metadata:latest
    env_file:
      - .env
    environment:
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      METADATA_SERVICE_PORT: ${METADATA_SERVICE_PORT:-8081}
      KBARR_DATA_DIR: /app/data
    volumes:
      - ${DATA_DIR_HOST:-./data}:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  indexer:
    image: ghcr.io/kingbenny101/kbarr-indexer:latest
    env_file:
      - .env
    environment:
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      INDEXER_SERVICE_PORT: ${INDEXER_SERVICE_PORT:-8082}
    depends_on:
      postgres:
        condition: service_healthy

  downloader:
    image: ghcr.io/kingbenny101/kbarr-downloader:latest
    env_file:
      - .env
    environment:
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DOWNLOADER_SERVICE_PORT: ${DOWNLOADER_SERVICE_PORT:-8083}
      QBITTORRENT_URL: ${QBITTORRENT_URL:-http://localhost:8080}  
    depends_on:
      postgres:
        condition: service_healthy

  core:
    image: ghcr.io/kingbenny101/kbarr-core:latest
    env_file:
      - .env
    environment:
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PORT: ${PORT:-8282}
      KBARR_DATA_DIR: /app/data
      METADATA_GRPC_ADDR: metadata:8081
      INDEXER_GRPC_ADDR: indexer:8082
      DOWNLOADER_GRPC_ADDR: downloader:8083
    ports:
      - "${PORT:-8282}:8282"      
    depends_on:
      postgres:
        condition: service_healthy
      metadata:
        condition: service_started
      indexer:
        condition: service_started
      downloader:
        condition: service_started
    volumes:
      - ${DATA_DIR_HOST:-./data}:/app/data

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev

volumes:
  pg_data: