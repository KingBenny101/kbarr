# This is the production compose file. It pulls pre-built images from ghcr.io.
services:
  postgres:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  downloader:
    image: ghcr.io/kingbenny101/kbarr-downloader:latest
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL}
      DOWNLOADER_SERVICE_PORT: ${DOWNLOADER_SERVICE_PORT:-8083}
      QBITTORRENT_URL: ${QBITTORRENT_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8083"

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev

  anidb:
    image: ghcr.io/kingbenny101/kbarr-anidb:latest
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL}
      ANIDB_SERVICE_PORT: ${ANIDB_SERVICE_PORT:-8081}
      KBARR_DATA_DIR: ${KBARR_DATA_DIR:-/app/data}
    expose:
      - "8081"
    volumes:
      - ${DATA_DIR_HOST:-./data}:${KBARR_DATA_DIR:-/app/data}

  prowlarr:
    image: ghcr.io/kingbenny101/kbarr-prowlarr:latest
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL}
      PROWLARR_SERVICE_PORT: ${PROWLARR_SERVICE_PORT:-8082}
    expose:
      - "8082"

  core:
    image: ghcr.io/kingbenny101/kbarr-core:latest
    env_file:
      - .env
    environment:
      DB_URL: ${DB_URL}
      PORT: ${PORT:-8282}
      KBARR_DATA_DIR: ${KBARR_DATA_DIR:-/app/data}
      ANIDB_GRPC_ADDR: ${ANIDB_GRPC_ADDR:-anidb:8081}
      PROWLARR_GRPC_ADDR: ${PROWLARR_GRPC_ADDR:-prowlarr:8082}
      DOWNLOADER_GRPC_ADDR: ${DOWNLOADER_GRPC_ADDR:-downloader:8083}
    depends_on:
      anidb:
        condition: service_started
      prowlarr:
        condition: service_started
    ports:
      - "${PORT:-8282}:${PORT:-8282}"
    volumes:
      - ${DATA_DIR_HOST:-./data}:${KBARR_DATA_DIR:-/app/data}

volumes:
  pg_data:
